<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitness & Workout Management System</title><link rel="stylesheet" href="css/style.css"></head><body><header><h1>Fitness & Workout Management System</h1><p>Plan workouts and track your fitness progress</p></header><main><section class="card"><h2>Add Workout</h2><form id="workoutForm"><label>Exercise Name</label><input id="exercise" required><label>Workout Type</label><select id="type" required><option value="">Select type</option><option>Strength</option><option>Cardio</option><option>Flexibility</option><option>Core</option></select><label>Duration (minutes)</label><input id="duration" type="number" min="1" required><label>Date</label><input id="date" type="date" required><button>Add Workout</button></form><p id="message"></p></section><section class="card"><h2>Workout History</h2><div id="list"></div></section><section class="card"><h2>Fitness Summary</h2><p>Total Workouts: <b id="total">0</b></p><p>Total Minutes: <b id="minutes">0</b></p></section></main><footer>Fitness & Workout Management System © 2026</footer><script src="js/script.js"></script></body></html>
